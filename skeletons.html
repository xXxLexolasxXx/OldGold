<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Лист скелетов: было и стало</title>
<style>
body{margin:0;background:#1a1c22;color:#eee;font:13px/1.35 sans-serif}
#bar{position:sticky;top:0;background:#000c;padding:6px 10px;display:flex;gap:12px;align-items:center;z-index:2}
h3{margin:12px 10px 2px;color:#f6d458}.row{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px}
.cell{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#aab}
canvas{image-rendering:pixelated;background:#4a5a30}
</style></head><body>
<div id="bar"><b>Скелеты: было (вектор) и стало (пиксель-арт)</b><label>масштаб <select id="sc"><option>2</option><option selected>3</option><option>4</option></select></label>
<label>облик <select id="lk"><option value="0">0 рыжий колпак</option><option value="1">1 охристый колпак</option><option value="2">2 рыжий + щит</option><option value="3">3 охристый + щит</option></select></label>
<label><input type="checkbox" id="gk"> фон с травой</label><span id="err" style="color:#f88"></span></div>
<div id="out"></div>
<script>function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}</script><script src="js/config.js"></script><script src="js/sprites.js"></script><script src="js/pixel.js"></script>
<script>
// заглушки того, что в игре лежит в других файлах
const Game = { time: 0, skels: [] }; let R = { newSprites: 0, sprMs: 0 };
function nightDiff() { return 1; } function drawGrabbed() {} function drawGrip() {} function snapVictim() {} function grabIdx() { return 0; }
</script>
<script src="js/world/grab.js"></script><script src="js/world/skeletons.js"></script><script src="js/world/skelart.js"></script>
<script>
const W = SKA.W, H = SKA.H;
function fake(o) { return Object.assign({ x: 0, y: 0, hx: 3, hy: 3, face: 1, phase: 0, k: 1, state: 'roam', t: 0, moving: false, atk: -9, scared: 0, hitT: -9, fighters: [] }, o); }
// кадр «было»: тот же момент, векторным рисованием, в клетке W×H
function oldCell(k, o, t) {
  const cv = document.createElement('canvas'); cv.width = W * k; cv.height = H * k;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = true; c.save(); c.scale(k, k);
  Game.time = t; const s = fake(o); s.x = SKA.AX / TILE; s.y = (SKA.AY - 6) / TILE;
  drawSkeletonVector(c, s); c.restore(); return cv;
}
function newCell(k, look, view, pose, frame) {
  const cv = document.createElement('canvas'); cv.width = W * k; cv.height = H * k;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
  const s = fake({ hx: look & 1 ? 1 : 0, hy: look & 2 ? 1 : 0 });
  // look = floor(hx*7+hy*13)&3: подбираем дом под нужный облик
  let hx = 0; for (let a = 0; a < 40; a++) { s.hx = a; s.hy = 0; if (skelLook(s) === look) { hx = a; break; } } s.hx = hx; s.hy = 0;
  const e = skelSprite(s, view, pose, frame); R.newSprites = 0; R.sprMs = 0;
  c.drawImage(e.cv, 0, 0, W * k, H * k); return cv;
}
const ROWS = [
  ['Покой: 6 кадров', 'idle', 6, 'roam'], ['Ходьба: 8 кадров', 'walk', 8, 'roam'],
];
function draw() {
  const k = +sc.value, look = +lk.value; out.innerHTML = '';
  document.body.style.setProperty('--bg', gk.checked ? '#4a5a30' : '#2a2e38');
  for (const cv of document.querySelectorAll('canvas')) cv.style.background = gk.checked ? '#4a5a30' : '#2a2e38';
  const sec = (t) => { const h = document.createElement('h3'); h.textContent = t; out.appendChild(h); const r = document.createElement('div'); r.className = 'row'; out.appendChild(r); return r; };
  const add = (row, cv, label) => { cv.style.background = gk.checked ? '#4a5a30' : '#2a2e38'; const d = document.createElement('div'); d.className = 'cell'; d.appendChild(cv); const sp = document.createElement('span'); sp.textContent = label; d.appendChild(sp); row.appendChild(d); };
  // было: вектор
  let r = sec('БЫЛО — векторное рисование, один вид (юг/север = то же самое), зеркало по направлению');
  add(r, oldCell(k, {}, 0.3), 'покой'); add(r, oldCell(k, {}, 1.2), 'покой');
  for (let i = 0; i < 4; i++) add(r, oldCell(k, { moving: true, phase: i * 1.1 }, 0.3 + i), 'ходьба ' + (i + 1));
  for (const [n, a] of [['замах', 0.1], ['удар', 0.6], ['стойка', 1.5]]) add(r, oldCell(k, { state: 'fight', atk: -a }, 0), 'бой: ' + n);
  add(r, oldCell(k, { state: 'dead', t: 0.1 }, 0), 'смерть'); add(r, oldCell(k, { state: 'dead', t: 0.6 }, 0), 'смерть'); add(r, oldCell(k, { state: 'dead', t: 1.5 }, 0), 'смерть');
  for (const view of ['S', 'E', 'N']) {
    r = sec('СТАЛО — вид ' + { S: 'S (на нас)', E: 'E (вбок; запад — зеркало)', N: 'N (спиной)' }[view] + ': покой 6 · ходьба 8');
    for (let i = 0; i < 6; i++) add(r, newCell(k, look, view, 'idle', i), 'покой ' + (i + 1));
    for (let i = 0; i < 8; i++) add(r, newCell(k, look, view, 'walk', i), 'ходьба ' + (i + 1));
  }
  r = sec('СТАЛО — атака 9 кадров (замах 3 · удар 3 · возврат 3)'); for (let i = 0; i < 9; i++) add(r, newCell(k, look, 'E', 'atk', i), 'атака ' + (i + 1));
  r = sec('СТАЛО — удар по скелету 4 кадра'); for (let i = 0; i < 4; i++) add(r, newCell(k, look, 'E', 'hit', i), 'удар ' + (i + 1));
  r = sec('СТАЛО — смерть 9 кадров'); for (let i = 0; i < 9; i++) add(r, newCell(k, look, 'E', 'die', i), 'смерть ' + (i + 1));
  r = sec('СТАЛО — захват гнома 9 кадров + шаг с ношей 4 (гнома рисует grab.js отдельно)'); for (let i = 0; i < 13; i++) add(r, newCell(k, look, 'E', 'grab', i), (i < 9 ? 'хват ' : 'несёт ') + (i < 9 ? i + 1 : i - 8));
  r = sec('СТАЛО — все четыре облика: покой, вид S и E'); for (let l = 0; l < 4; l++) { add(r, newCell(k, l, 'S', 'idle', 0), 'облик ' + l + ' S'); add(r, newCell(k, l, 'E', 'walk', 2), 'облик ' + l + ' E'); }
}
sc.oninput = lk.oninput = gk.oninput = draw; window.onerror = (m, s, l) => { err.textContent = m + ' @' + l; }; draw();
</script></body></html>
