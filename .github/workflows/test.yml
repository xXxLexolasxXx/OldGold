# Проверки OldGold: на каждый push и pull request — быстрый прогон (загрузка скриптов, сервер, симуляция,
# сохранение→загрузка, детерминизм, кооп); раз в неделю и по кнопке — длинный (несколько игровых часов).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      long:
        description: 'Длинный прогон'
        type: boolean
        default: false
  schedule:
    - cron: '30 3 * * 1'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Быстрый прогон
        if: ${{ github.event_name != 'schedule' && !inputs.long }}
        run: node tests/run.js --json report.json
      - name: Длинный прогон
        if: ${{ github.event_name == 'schedule' || inputs.long }}
        run: node tests/run.js --long --json report.json
      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.json
          if-no-files-found: ignore
