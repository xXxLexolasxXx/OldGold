<script>

const cv = document.getElementById('cv'); cv.width = 1500; cv.height = 560; const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;

const put = (spr, x, y, Z) => { const [ox, oy, w, h] = spr.fzO; c.drawImage(spr, x - ox * Z, y - oy * Z, w * Z, h * Z); };
const L = [['hurt', 0], ['hurt', 1], ['die', 0], ['die', 1], ['die', 2], ['die', 3], ['die', 4], ['die', 5], ['win', 0], ['win', 1], ['win', 2], ['win', 3]];

document.title = 'ready';
} catch (e) { document.title = 'fail ' + e.message; }
