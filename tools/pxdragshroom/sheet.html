<!doctype html><meta charset="utf-8"><title>…</title>
<body style="margin:0;background:#1b2a1f">
<canvas id="cv"></canvas>
<script src="../../js/world/fairy2.js"></script>
<script src="dragshroom.js"></script>
<script>
try {
const W = 1500, cv = document.getElementById('cv');
const FR = [['idle', 'покой'], ['walk', 'ходьба'], ['atk', 'атака']];
const rowsH = 40 + 2 * 345 + 40 + 2 * (3 * 170 + 40) + 260;
cv.width = W; cv.height = rowsH;
const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
c.fillStyle = '#1b2a1f'; c.fillRect(0, 0, W, rowsH);
const T = (s, x, y, sz = 22, col = '#f2e6c8') => { c.fillStyle = col; c.font = `bold ${sz}px Segoe UI, sans-serif`; c.fillText(s, x, y); };
const cell = (x, y, w, h) => { c.fillStyle = '#4a6a34'; c.fillRect(x, y, w, h); c.fillStyle = '#557a3c'; for (let i = 0; i < 40; i++) c.fillRect(x + (i * 37 % w), y + (i * 53 % h), 3, 2); };
const put = (spr, x, y, Z, face = 1) => {
  const [ox, oy, w, h] = spr.fzO; c.save(); c.imageSmoothingEnabled = !spr.fzPx; c.translate(x, y); if (face < 0) c.scale(-1, 1);
  c.drawImage(spr, -ox * Z, -oy * Z, w * Z, h * Z); c.restore();
};
const SEL = (new URLSearchParams(location.search)).get('only');
let y = 30;
T('Дракончик и чумной моховик — пиксель ×3 мельче мирового (метод Полудницы). Крупно ×8', 20, y, 24); y += 14;
const big = [[fzDragonSprite, 'idle', 0, 'Дракончик: покой'], [fzDragonSprite, 'walk', 1, 'Дракончик: ходьба'], [fzDragonSprite, 'atk', 3, 'Дракончик: огонь'], [fzShroomSprite, 'idle', 1, 'Моховик: покой'], [fzShroomSprite, 'walk', 1, 'Моховик: ходьба'], [fzShroomSprite, 'atk', 3, 'Моховик: удар шляпкой']];
const cw = 490, ch = 340, Z = 8;
big.forEach(([fn, m, p, n], i) => { const x = 10 + (i % 3) * (cw + 5), yy = y + Math.floor(i / 3) * (ch + 5); cell(x, yy, cw, ch); T(n, x + 10, yy + 26, 18, '#ffd860'); put(fn(m, p), x + cw / 2, yy + ch - 40, Z); });
y += 2 * (ch + 5) + 20;
for (const [fn, name, zz] of [[fzDragonSprite, "Дракончик", 3], [fzShroomSprite, "Чумной моховик", 3]]) {
  T(name + ' — все кадры ×2: покой p0..5 (p4 моргает), ходьба p0..5, атака p0..5 (0–1 замах)', 20, y + 6, 18); y += 14;
  FR.forEach(([m, mn], r) => {
    for (let p = 0; p < 6; p++) { const x = 10 + p * 246, yy = y + r * 170; cell(x, yy, 240, 164); T(mn + ' p' + p, x + 6, yy + 18, 13); put(fn(m, p), x + 120, yy + 150, zz); }
  });
  y += 3 * 170 + 20;
}
T('Как в игре (масштаб ×1 и ×2): дракончик и моховик рядом с гномом-ориентиром', 20, y + 6, 18); y += 14;
cell(10, y, 1480, 220);
const gn = (x, yy, Z) => { c.fillStyle = '#7a4a2a'; c.fillRect(x - 4 * Z, yy - 12 * Z, 8 * Z, 12 * Z); c.fillStyle = '#e0b088'; c.fillRect(x - 3 * Z, yy - 17 * Z, 6 * Z, 5 * Z); c.fillStyle = '#c03020'; c.fillRect(x - 4 * Z, yy - 21 * Z, 8 * Z, 4 * Z); };
gn(40, y + 200, 1); put(fzDragonSprite('idle', 0), 110, y + 200, 1); put(fzDragonSprite('atk', 3), 190, y + 200, 1); put(fzShroomSprite('idle', 1), 280, y + 200, 1); put(fzShroomSprite('atk', 3), 360, y + 200, 1);
gn(520, y + 200, 2); put(fzDragonSprite('idle', 0), 640, y + 200, 2); put(fzDragonSprite('walk', 2), 780, y + 200, 2, -1); put(fzShroomSprite('idle', 1), 940, y + 200, 2); put(fzShroomSprite('walk', 2), 1090, y + 200, 2, -1); put(fzShroomSprite('atk', 4), 1250, y + 200, 2);
document.title = 'ready';
} catch (e) { document.title = 'fail ' + e.message + ' ' + e.stack; }
</script>
