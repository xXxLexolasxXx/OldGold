blit(sprBabyDragon(1), 90, 250, 4); for (let i = 0; i < 8; i++) blit(sprBabyDragon(10 + i), 260 + i * 158, 250, 4);
T('гнездо', 60, 92, 14); for (let i = 0; i < 8; i++) T('полёт ' + (i + 1), 220 + i * 158, 92, 14);
