<!doctype html><meta charset=utf-8><title>Гномы: варианты пикселя</title>
<body style="margin:0;background:#2a3a22">
<canvas id=sheet width=1280 height=10></canvas>
<script>
// Лист выбора гнома: текущий (шаг ×2) и четыре варианта. Рендер: node tools/gnome-px-render.js → promo/ref/gnome-px-2026-10-27/sheet.png
window.ENT_LOOK = {}; window.TILE = 32; window.R = { sprMs: 0 };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function unitLevel() { return 1; }
function drawFire() {}
window.Game = { time: 0, buildings: [] };
const SRC = ['../js/config.js', '../js/sprites.js', '../js/pixel.js', '../js/people.js', 'gnome-px.js'];
const PROFS = [
  { n: 'дровосек', cap: '#c83a28', coat: '#2e5a7e', pants: '#4a3a2a', beard: '#ece6cc', t: 'woodcutter' },
  { n: 'строитель', cap: '#e0a822', coat: '#6e1c22', pants: '#5a4028', beard: '#9a7a52', apron: '#8a6a44', t: 'builder' },
  { n: 'шахтёр', cap: '#2e4a7a', coat: '#5e5448', pants: '#3e3630', beard: '#cfc8a8', candle: 1, t: 'miner' },
  { n: 'каменщик', cap: '#9a9aa6', coat: '#8a6e4c', pants: '#4a4238', beard: '#c8823a', apron: '#8a6a44', t: 'stonemason' },
];
const BASE = { hs: 1, hy: -18.2, capH: 14.5, tipX: 3, droop: .5, bl: 9.6, eye: 'dot', det: 0, nose: 1, ear: 1 };
const VARS = [
  { id: 'A', name: 'A · ×3 «Классика»', sub: 'пиксель 1/3, глаза-точки', prm: { ...BASE, S: 3 } },
  { id: 'B', name: 'B · ×3 «Прорисованный»', sub: 'пряди, складки, заплатка, глаза с белком', prm: { ...BASE, S: 3, det: 2, eye: 'iris', capH: 15, tipX: -4, droop: .7, bl: 10 } },
  { id: 'C', name: 'C · ×3 «Крупноголовый»', sub: 'голова больше, глаза крупнее', prm: { ...BASE, S: 3, hs: 1.22, hy: -19.3, capH: 11.5, capW: 1.05, tipX: 3, droop: .8, bl: 8, eye: 'big', det: 1, nose: .9, ear: .9 } },
  { id: 'D', name: 'D · ×6 «Ультра-мелкий»', sub: 'пиксель 1/6, глаза с ресницами', prm: { ...BASE, S: 6, det: 2, eye: 'fine', capH: 15, tipX: -4, droop: .7, bl: 10 } },
];
function loadAll() { return SRC.reduce((p, f) => p.then(() => new Promise(ok => { const s = document.createElement('script'); s.src = f; s.onload = ok; s.onerror = () => { window.ERR = (window.ERR || '') + ' нет ' + f; ok(); }; document.head.appendChild(s); })), Promise.resolve()); }
loadAll().then(() => {
  const cur = pr => personSprite({ type: pr.t, look: 5, carry: null }, 'S', 'idle', 0);   // 52×76, ступни (26,70)
  // кадр спрайта: {cv, S, fx, fy} — ступни в пикселях арта
  const sprOf = (vi, pr) => vi < 0 ? { cv: cur(pr), S: 2, fx: 26, fy: 70 } : { cv: gnomePx(VARS[vi].prm, pr), S: VARS[vi].prm.S, fx: GN_OX * VARS[vi].prm.S, fy: GN_OY * VARS[vi].prm.S };
  const cvs = document.getElementById('sheet'), W = 1280;
  const cols = [{ name: 'ТЕКУЩИЙ · ×2', sub: 'как сейчас в игре', vi: -1 }, ...VARS.map((v, i) => ({ name: v.name, sub: v.sub, vi: i }))];
  const cw = 256;
  // высота листа: заголовок + ряд 1 (Z=6) + ряд 2 (Z=12 голова) + ряд 3 (Z=3 реальный размер) + 3 строки профессий
  const rows = { fig: 270, head: 276, real: 140, prof: 280 };
  const H = 56 + 30 + rows.fig + 36 + rows.head + 36 + rows.real + 36 + 3 * rows.prof + 20;
  cvs.height = H; const c = cvs.getContext('2d'); c.imageSmoothingEnabled = false;
  c.fillStyle = '#4f7a30'; c.fillRect(0, 0, W, H);
  // сетка травы (каждые 32 единицы мира не нужна — ровный фон с лёгкой клеткой)
  c.fillStyle = '#d8ecc0'; c.font = 'bold 20px sans-serif'; c.fillText('Гномы: сравнение шагов пикселя и прорисовки — шапка выше глаз, глаза открыты', 16, 30);
  c.font = '13px sans-serif'; c.fillStyle = '#e8f4d0'; c.fillText('Все гномы одного роста. Ряд 1 — ×6 к миру (целое), ряд 2 — голова ×12, ряд 3 — как мелко на экране (×3), ниже — профессии.', 16, 50);
  // blit: ступни в (dx, dy), масштаб Z к миру (экранных пикселей на единицу мира), crop в единицах мира [x0,y0,x1,y1] от ступней
  function blit(s, dx, dy, Z, crop) {
    const k = Z / s.S; let sx = 0, sy = 0, sw = s.cv.width, sh = s.cv.height, ox = -s.fx * k, oy = -s.fy * k;
    if (crop) { sx = s.fx + crop[0] * s.S; sy = s.fy + crop[1] * s.S; sw = (crop[2] - crop[0]) * s.S; sh = (crop[3] - crop[1]) * s.S; ox = crop[0] * Z; oy = crop[1] * Z; }
    c.drawImage(s.cv, sx, sy, sw, sh, dx + ox, dy + oy, sw * k, sh * k);
  }
  const lab = (t, x, y, f = 'bold 14px sans-serif', col = '#fff') => { c.font = f; c.fillStyle = '#0006'; c.fillText(t, x + 1, y + 1); c.fillStyle = col; c.fillText(t, x, y); };
  let y = 56 + 30;
  // ряд 1: полная фигура ×6
  cols.forEach((col, i) => {
    const x0 = i * cw; lab(col.name, x0 + 10, y - 6, 'bold 13px sans-serif'); lab(col.sub, x0 + 10, y + 8, '11px sans-serif', '#d8ecc0');
    blit(sprOf(col.vi, PROFS[0]), x0 + cw / 2, y + 16 + 240, 6);
  });
  y += rows.fig;
  lab('голова крупно ×12 (глаза, шапка, борода)', 10, y + 4, 'bold 13px sans-serif', '#fff');
  y += 14;
  cols.forEach((col, i) => { const x0 = i * cw; blit(sprOf(col.vi, PROFS[0]), x0 + cw / 2, y + 30 * 12, 12, [-10.5, -30, 10.5, -8.5]); });
  y += rows.head - 6;
  lab('реальный размер на экране (×3 к миру), две профессии', 10, y + 4, 'bold 13px sans-serif');
  y += 14;
  cols.forEach((col, i) => { const x0 = i * cw; [0, 2].forEach((pi, j) => blit(sprOf(col.vi, PROFS[pi]), x0 + 64 + j * 110, y + 118, 3)); });
  y += rows.real - 6;
  // профессии: по строке на два варианта (+текущий в первой)
  const strips = [[-1, 0], [1, 2], [3]];
  strips.forEach(group => {
    group.forEach((vi, gi) => {
      const x0 = gi * 640; lab(vi < 0 ? 'ТЕКУЩИЙ · ×2' : VARS[vi].name, x0 + 10, y + 12, 'bold 13px sans-serif');
      PROFS.forEach((pr, pi) => { blit(sprOf(vi, pr), x0 + 80 + pi * 150, y + 40 + 6 * 37, 6); lab(pr.n, x0 + 50 + pi * 150, y + 276, '11px sans-serif', '#d8ecc0'); });
    });
    y += rows.prof;
  });
  window.READY = true;
});
</script>
