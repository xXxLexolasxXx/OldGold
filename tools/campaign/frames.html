<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Портреты в окнах</title>
<link rel="stylesheet" href="../../css/campaign.css"><link rel="stylesheet" href="../../css/lore.css">
<style>*{box-sizing:border-box}body{background:#1a1410;margin:0;padding:10px;font-family:Kurale,Georgia,serif}body.l{background:#d8cbaa}
.w{position:relative;margin:0 0 14px}.w #camp-dlg,.w #lore-card{position:relative;left:auto;top:auto;bottom:auto;transform:none;margin:0 auto;animation:none}
.w #lore-card{animation:none}</style>
<body><div id=o></div>
<script>function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}</script>
<script src="../../js/config.js"></script><script src="../../js/sprites.js"></script><script src="../../js/pixel.js"></script>
<script src="../../js/world/neutralart.js"></script><script src="../../js/campaign/faces.js"></script>
<script>
const q=location.search;if(q.includes('light'))document.body.className='l';
const P=k=>`<span class="cd-pt" style="border-color:#e0a050;background-color:#3a2a14"><img src="${campFaceUrl(k,0)}"></span>`;
const T='Грум, сегодня праздник. Ворчать будешь завтра. The quick brown dwarf jumps over a long English line without cutting.';
const L=k=>`<span class="lc-pt" style="border-color:#e0a050;background-color:#3a2a14"><img src="${campFaceUrl(k,0)}"></span>`;
let h='';
for(const k of ['grum','pim','tan','elder','kremen','heroF','shnyr','mrak']){
h+=`<div class=w><div id="camp-dlg">${'<div class="cd-face">'+P(k)+'</div>'}<div class="cd-body"><div class="cd-who">${k}</div><div class="cd-text">${T}</div><div class="cd-btns"><button class="ghost">Skip</button><button>Next ▸</button></div></div></div></div>`;}
h+=`<div class=w><div id="lore-card" class="k-letter"><div class="lc-top"><b>Letter</b></div><div class="lc-say">${L('pim')}<div class="lc-body"><div class="lc-name">Pim</div><div class="lc-text">${T}</div></div></div></div></div>`;
h+=`<div class=w><div id="lore-card" class="k-memory"><div class="lc-top"><b>Memory</b></div><div class="lc-say">${L('yagla')}<div class="lc-body"><div class="lc-name">Yagla</div><div class="lc-text">${T}</div></div></div></div></div>`;
o.innerHTML=h;
</script>
