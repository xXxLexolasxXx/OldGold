<!doctype html><meta charset=utf-8><title>Гномы: кадры</title>
<body style="margin:0;background:#2a3a22">
<canvas id=sheet width=1280 height=10></canvas>
<script>
// Лист кадров гномов из настоящего js/people.js: по 12 кадров на действие. Рендер: node tools/gnome-frames-render.js [type]
window.ENT_LOOK = {}; window.TILE = 32; window.R = { sprMs: 0 };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function unitLevel() { return 1; }
function drawFire() {}
window.Game = { time: 0, buildings: [] };
const Q = new URLSearchParams(location.search), TYPE = Q.get('type') || 'woodcutter';
const SRC = ['../js/config.js', '../js/sprites.js', '../js/pixel.js', '../js/people.js'];
const load = f => new Promise(ok => { const s = document.createElement('script'); s.src = f; s.onload = ok; s.onerror = () => { window.ERR = (window.ERR || '') + ' нет ' + f; ok(); }; document.head.appendChild(s); });
const ROWS = JSON.parse(Q.get('rows') || '[["стоит (дыхание)","S","idle"],["ходьба сбоку","E","walk"],["ходьба спереди","S","walk"],["ходьба со спины","N","walk"],["ходьба с ношей","E","walk","timber"],["рубка топором","E","work","chop"],["кирка","E","work","mine"],["молоток","E","work","build"],["серп","E","work","reap"],["лопата","E","work","dig"]]');
SRC.reduce((p, f) => p.then(() => load(f)), Promise.resolve()).then(() => {
  const Z = 6, k = Z / PART, CW = 104, RH = 38 * Z + 18;
  const cv = document.getElementById('sheet'); cv.height = 40 + ROWS.length * RH; const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
  c.fillStyle = '#4f7a30'; c.fillRect(0, 0, 1280, cv.height);
  c.font = 'bold 16px sans-serif'; c.fillStyle = '#e8f4d0'; c.fillText('Гном «' + TYPE + '», пиксель ×' + PART + ', по 12 кадров на действие (×6 к миру)', 12, 24);
  ROWS.forEach((r, ri) => {
    const [name, view, pose, extra] = r, y = 40 + ri * RH;
    c.font = 'bold 12px sans-serif'; c.fillStyle = '#fff'; c.fillText(name, 8, y + 12);
    for (let f = 0; f < 12; f++) {
      const u = { type: TYPE, look: 5, carry: pose === 'walk' && extra ? extra : null, carryN: 1 };
      const fr = pose === 'work' ? { anim: extra, f } : f;
      const spr = personSprite(u, view, pose, fr, {});
      c.drawImage(spr, 4 + f * CW + CW / 2 - 13 * Z, y + 18 + 35 * Z - 35 * Z + 0, spr.width * k, spr.height * k);
      c.font = '10px sans-serif'; c.fillStyle = '#d8ecc0'; c.fillText(String(f + 1), 4 + f * CW + CW / 2 - 3, y + RH - 2);
    }
  });
  window.READY = true;
}).catch(e => { window.ERR = String(e); window.READY = true; });
</script>
