<h1>Нет связи с сайтом</h1>
<p>OldGold грузится из интернета. Включите Wi-Fi или мобильную сеть — игра запустится сама.</p>
<button id="r">Повторить</button>
<script>
var URL_='https://xxxlexolasxxx.github.io/OldGold/';
function go(){location.href=URL_;}
document.getElementById('r').onclick=go;
// событие online в WebView ненадёжно — раз в 4 с проверяем, отвечает ли сайт, и сразу открываем игру
function probe(){fetch(URL_+'manifest.webmanifest?p='+Date.now(),{mode:'no-cors',cache:'no-store'}).then(go,function(){});}
addEventListener('online',go);
setInterval(probe,4000);
</script></body></html>
