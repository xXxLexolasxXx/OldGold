<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Лист спрайтов зданий</title>
<style>
body{margin:0;background:#4a6e30;color:#eee;font:12px/1.3 sans-serif}
#bar{position:sticky;top:0;background:#222c;padding:6px 10px;display:flex;gap:12px;align-items:center}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:10px}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.cell canvas{image-rendering:pixelated;background:
 repeating-linear-gradient(0deg,#5c8236 0 1px,transparent 1px 32px),
 repeating-linear-gradient(90deg,#5c8236 0 1px,transparent 1px 32px),#4f7a30}
.lbl{color:#fff;text-shadow:0 1px 2px #000}
</style></head><body>
<div id="bar"><b id="title"></b> <label>масштаб <select id="sc"><option>2</option><option selected>3</option><option>4</option></select></label>
<label><input type="checkbox" id="lv2"> уровень 2</label> <label><input type="checkbox" id="rot"> поворот (вход на восток)</label> <button id='save'>сохранить PNG</button> <span id="err" style="color:#f88"></span></div>
<div class="row" id="out"></div>
<script>
const q=new URLSearchParams(location.search), base=q.get('base')||'js';
document.getElementById('title').textContent=base==='js'?'ПОСЛЕ (js/)':'ДО ('+base+'/)';
window.onerror=(m,s,l)=>{document.getElementById('err').textContent+=` ${m} @${(s||'').split('/').pop()}:${l};`;};
window.ENT_LOOK={};const files=['js/world/fire.js','js/config.js','js/world.js','js/path.js','js/entities.js',base+'/levels.js','js/events.js','js/sprites.js','js/world/rocks.js',base+'/buildings.js',base+'/bmodels.js',base+'/graveyard.js','js/world/decor.js',base+'/pixel.js',base+'/pixelart.js',base+'/pixelart2.js',base+'/pixelart3.js',...(base==='js'?['js/pixelstyle.js']:[]),'js/render.js'];
(async()=>{
 for(const f of files){await new Promise((ok,bad)=>{const s=document.createElement('script');s.src=f+'?v='+Date.now();s.onload=ok;s.onerror=()=>{document.getElementById('err').textContent+=' не загрузился '+f;ok();};document.head.appendChild(s);});}
 window.ENT_LOOK=window.ENT_LOOK||{};if(typeof Game==='undefined')window.Game={time:0,buildings:[]};
 if(typeof R==='undefined')window.R={smooth:false};
 window.TILE=window.TILE||32;
 if(q.get('sc'))document.getElementById('sc').value=q.get('sc'); if(q.get('lv2'))document.getElementById('lv2').checked=true; if(q.get('rot'))document.getElementById('rot').checked=true; draw(); if(q.get('save'))await savePng(q.get('save'));
 for(const id of['sc','lv2','rot'])document.getElementById(id).onchange=draw; document.getElementById('save').onclick=savePng;
})();
window.CELLS=[];
async function savePng(nm){const cells=CELLS;const k=+document.getElementById("sc").value;const COLS=+q.get("cols")||4;const cw=Math.max(...cells.map(c=>c.cv.width))+8,ch=Math.max(...cells.map(c=>c.cv.height))+22;const rows=Math.ceil(cells.length/COLS);const big=document.createElement("canvas");big.width=cw*COLS;big.height=ch*rows;const c=big.getContext("2d");c.fillStyle="#4f7a30";c.fillRect(0,0,big.width,big.height);c.strokeStyle="#5c8236";for(let x=0;x<big.width;x+=32*k){c.beginPath();c.moveTo(x+.5,0);c.lineTo(x+.5,big.height);c.stroke();}for(let y=0;y<big.height;y+=32*k){c.beginPath();c.moveTo(0,y+.5);c.lineTo(big.width,y+.5);c.stroke();}c.imageSmoothingEnabled=false;cells.forEach((cl,i)=>{const x=(i%COLS)*cw+4,y=Math.floor(i/COLS)*ch+2;c.drawImage(cl.cv,x,y+ch-22-cl.cv.height);c.fillStyle="#fff";c.font="12px sans-serif";c.fillText(cl.name,x,y+ch-6);});const lv=document.getElementById("lv2").checked?2:1,rot=document.getElementById("rot").checked?1:0;const name=(typeof nm==="string"&&nm!=="1")?nm+".png":(base==="js"?"after":"before")+"_x"+k+"_L"+lv+"_r"+rot+".png";const r=await fetch("/save?name="+name,{method:"POST",body:big.toDataURL("image/png")});document.getElementById("err").textContent=await r.text();}
function draw(){CELLS=[];
 const out=document.getElementById('out');out.innerHTML='';
 const k=+document.getElementById('sc').value, lv=document.getElementById('lv2').checked?2:1, rot=document.getElementById('rot').checked?1:0;
 let types=[...BUILD_ORDER,'graveyard'].filter(t=>BUILDINGS[t]); if(q.get('only'))types=q.get('only').split(',');
 for(const t of types){
  try{
   const spr=buildingSprite(t,rot,lv);
   const cv=document.createElement('canvas');cv.width=spr.w*k;cv.height=spr.h*k;
   const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
   c.drawImage(spr.shadow,0,0,cv.width,cv.height);
   c.drawImage(spr.canvas,0,0,cv.width,cv.height);
   // точки крепления: трубы, насесты, вход
   c.fillStyle='rgba(255,0,0,.8)';for(const p of(spr.chimneys||[]))c.fillRect(p[0]*k-1,p[1]*k-1,3,3);
   c.fillStyle='rgba(0,200,255,.8)';for(const p of(spr.perches||[]))c.fillRect(p[0]*k-1,p[1]*k-1,3,3);
   c.fillStyle='rgba(255,255,0,.9)';c.fillRect(spr.doorCx*k-1,spr.baseY*k-1,3,3);
   CELLS.push({cv,name:BUILDINGS[t].name+' ('+t+')'});const d=document.createElement('div');d.className='cell';d.appendChild(cv);
   const l=document.createElement('div');l.className='lbl';l.textContent=`${BUILDINGS[t].name} (${t}) ${spr.w}×${spr.h}`;d.appendChild(l);out.appendChild(d);
  }catch(e){document.getElementById('err').textContent+=` ${t}: ${e.message};`;console.error(t,e);}
 }
}
</script></body></html>
